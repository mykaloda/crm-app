# Calls the event monitor every 5 minutes when the site runs on serverless
# hosting (Vercel Hobby only allows daily crons). Needs repository secrets
# SITE_URL (e.g. https://moment.vercel.app) and CRON_SECRET.
name: Event monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run monitor
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/tick"
